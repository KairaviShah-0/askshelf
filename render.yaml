services:
  - type: web
    name: askshelf
    runtime: docker
    plan: standard         # 2 GB RAM. Prophet report generation can run out of memory on the 512 MB free/starter plans
    healthCheckPath: /api/meta
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # paste it in the Render dashboard; never commit it
      - key: DAILY_AI_LIMIT
        value: "400"
